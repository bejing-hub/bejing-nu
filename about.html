<!DOCTYPE html>

<head>

</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div class="top-bar-inner">
        <div class="top-bar-left">
          <a href="index.html" style="color: var(--c-gold-soft); font-weight: 600; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-arrow-left"></i> <span data-i18n="navHome">Ana Sayfa</span>
          </a>
        </div>
        <div class="top-bar-right">
          <div class="social-links">
            <a href="https://www.facebook.com/people/Bejing-medya/61590594643490/" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://x.com/Bejingmed" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://www.instagram.com/medyabjng" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.youtube.com/@BejingMedya" target="_blank"><i class="fa-brands fa-youtube"></i></a>
            <a href="http://t.me/bejingmedya" target="_blank"><i class="fa-brands fa-telegram"></i></a>
          </div>
          <div class="lang-switcher">
            <button type="button" class="lang-btn active" data-lang="tr" onclick="setLanguage('tr')">Türkçe</button>
            <button type="button" class="lang-btn" data-lang="ku" onclick="setLanguage('ku')">Kurmancî</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner" style="justify-content: space-between;">
        <a href="index.html" class="brand-wrapper" title="Bêjing Medya">
          <img src="assets/images/logo.png" alt="Bêjing Medya Logo" class="brand-logo-img">
          <div class="brand-divider"></div>
          <span class="brand-slogan-text" id="headerBrandSlogan">Genç Kadınların Sesi</span>
        </a>
        <a href="videos.html" class="telegram-pill-btn" style="background: var(--c-mahogany);">
          <i class="fa-solid fa-play"></i> <span data-i18n="navVideos">Videolar</span>
        </a>
      </div>
    </div>
  </header>

  <main style="padding: 50px 0 80px;">
    <div class="container" style="max-width: 880px;">
      <div style="background: #FFF; border: 1px solid var(--c-border); border-radius: var(--radius-md); padding: 46px; box-shadow: var(--shadow-sm);">
        <h1 style="font-family: var(--font-display); font-size: 2.3rem; color: var(--c-mahogany); margin-bottom: 24px;" data-i18n="aboutManifestoTitle">
          Yayın İlkelerimiz ve Misyonumuz
        </h1>

          <p class="lead" style="font-size: 1.35rem; font-weight: 700; color: var(--c-terracotta); margin-bottom: 20px;" id="aboutSloganText">
            “Genç Kadınların Sesi”
          </p>
          <div id="aboutBodyContent">
            <!-- Dynamically rendered based on active language -->
          </div>
          
          <blockquote style="border-left: 4px solid var(--c-gold); padding: 18px 24px; background: var(--c-bg-surface); font-family: var(--font-display); font-style: italic; font-size: 1.25rem; margin: 28px 0; color: var(--c-mahogany);">
            “Hakikat aşktır, aşk ise özgür yaşamdır.”
          </blockquote>

          <div style="margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--c-border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <span style="font-weight: 700; color: var(--c-mahogany);">Bêjing Medya Kolektifi</span>
            <a href="contact.html" class="telegram-pill-btn" data-i18n="navContact">İletişim</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div style="text-align: center; padding: 24px 0 12px;"><img src="assets/images/logo.png" alt="Bêjing Medya Logo" style="max-height: 60px;"><div id="footerBrandSlogan" style="font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--c-gold-bright); margin-top: 6px;">Genç Kadınların Sesi</div></div>
    <div class="footer-bottom">
      <div class="container" style="text-align: center;">
        <p data-i18n="copyright">© 2026 Bêjing Medya. Tüm hakları saklıdır.</p>
      </div>
    </div>
  </footer>

  <script src="assets/js/data.js?v=2"></script>
  <script src="assets/js/i18n.js?v=2"></script>
  <script>
    const aboutContent = {
      tr: `
        <p>Bêjing Medya; genç kadınların düşünsel, kültürel, sanatsal ve toplumsal mücadelesini görünür kılmak, kadim hakikat arayışını günümüz dünyasının dinamizmiyle buluşturmak amacıyla yayın hayatını sürdüren bağımsız bir medya ve düşünce organıdır.</p>
        <p>Platformumuz salt bir haber mecrası ya da yalnızca bir video akışı değildir; kadın belleğini, kadın külliyatını, teorik atölye çalışmalarını ve örgülü keziyelerin kaleminden süzülen derinlikli tahlilleri bir araya getiren kapsamlı bir inceleme ve hafıza merkezidir.</p>
        <p>Haftalık yayınladığımız özel araştırma dosyaları ve Bêjing TV video yayınlarıyla; ezber bozan, özgürlükçü ve köklü bir kadın aydınlanmasını büyütmeyi hedefliyoruz.</p>
      `,
      ku: `
        <p>Bêjing Medya; platformeke serbixwe ya medya û ramanê ye ku armanc dike têkoşîna fikrî, çandî, hunerî û civakî ya jinên ciwan berbiçav bike û lêgerîna heqîqeta kevnar bi dînamîzma cîhana îro re bigihîne hev.</p>
        <p>Medyaya me tenê kanale nûçeyan a rojane nîne û ne tenê platformeke weşana fîlman e; ew navendek kûr a bîr, lêkolîn û xebatên atolyeyan e ku kûlliyata jinê û gotarên bi pênusa keziyan hatine nivîsandin bi hevre pêşkêş dike.</p>
        <p>Bi dosyayên lêkolînê yên heftane û weşanên vîdeoyî yên Bêjing TV re; em hewl didin ronakbîriya jinê ya azadîxwaz û şoreşger li ser bingeheke kûr û mayînde berfireh bikin.</p>
      `
    };

    function renderAboutPage() {
      const lang = getCurrentLang();
      document.getElementById('aboutBodyContent').innerHTML = aboutContent[lang] || aboutContent.tr;
      const sloganEl = document.getElementById('aboutSloganText');
      if (sloganEl) {
        sloganEl.textContent = (lang === 'ku') ? '“Dengê Jinên Ciwan”' : '“Genç Kadınların Sesi”';
      }
    }

    document.addEventListener('DOMContentLoaded', renderAboutPage);
    window.addEventListener('bejing:langChange', renderAboutPage);
  </script>
<script>
        function updateSloganDynamic() {
          const lang = (typeof getCurrentLang === 'function') ? getCurrentLang() : "tr";
          const s = (lang === "ku") ? "Dengê Jinên Ciwan" : "Genç Kadınların Sesi";
          const h = document.getElementById("headerBrandSlogan");
          const f = document.getElementById("footerBrandSlogan");
          if (h) h.textContent = s;
          if (f) f.textContent = s;
        }
        window.addEventListener("bejing:langChange", updateSloganDynamic);
        document.addEventListener("DOMContentLoaded", updateSloganDynamic);
      </script>
      </body>
</html>
