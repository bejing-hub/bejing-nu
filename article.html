<!DOCTYPE html>
<html lang="tr-TR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bêjing Medya | Makale & Araştırma</title>
  <link rel="icon" href="assets/images/logo.png" type="image/jpeg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=20260927_1435">
  <style>
    .article-page-wrap {
      padding: 40px 0 80px;
    }
    .article-container {
      max-width: 900px;
      margin: 0 auto;
      background: #FFF;
      border: 1px solid var(--c-border);
      border-radius: var(--radius-md);
      padding: 46px;
      box-shadow: var(--shadow-sm);
    }
    .article-header {
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--c-border);
    }
    .article-page-title {
      font-family: var(--font-display);
      font-size: 2.35rem;
      line-height: 1.3;
      color: var(--c-mahogany);
      margin: 16px 0 16px;
    }
    .article-reading-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: var(--c-bg-surface);
      border-radius: var(--radius-sm);
      margin-bottom: 26px;
    }
    .font-adjust-btn {
      background: #FFF;
      border: 1px solid var(--c-border);
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
      color: var(--c-mahogany);
      transition: all 0.2s;
    }
    .font-adjust-btn:hover {
      background: var(--c-gold-soft);
    }
    .article-featured-img-wrap {
      margin-bottom: 32px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      max-height: 520px;
    }
    .article-featured-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .article-video-container {
      margin: 32px 0;
      padding: 24px;
      background: #7D6650;
      border-radius: var(--radius-md);
      border: 1px solid var(--c-cinema-border);
      color: #FFF;
    }
    .video-responsive-wrap {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: var(--radius-sm);
    }
    .video-responsive-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .article-body {
      font-size: 1.15rem;
      line-height: 1.9;
      color: var(--c-text-main);
    }
    .article-body p {
      margin-bottom: 22px;
    }
    .article-body h2, .article-body h3, .article-body h4 {
      font-family: var(--font-display);
      color: var(--c-mahogany);
      margin: 32px 0 16px;
    }
    .article-body blockquote {
      border-left: 4px solid var(--c-gold);
      padding: 18px 26px;
      background: var(--c-bg-surface);
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.25rem;
      margin: 28px 0;
      color: var(--c-mahogany);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .share-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 18px 0;
      margin: 36px 0 20px;
      border-top: 1px solid var(--c-border);
      border-bottom: 1px solid var(--c-border);
    }
    .related-section {
      margin-top: 50px;
      padding-top: 36px;
      border-top: 2px solid var(--c-border);
    }
    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    @media (max-width: 768px) {
      .article-container {
        padding: 24px 18px;
      }
      .article-page-title {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div class="top-bar-inner">
        <div class="top-bar-left">
          <a href="index.html" style="color: var(--c-gold-soft); font-weight: 600; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-arrow-left"></i> <span data-i18n="navHome">Ana Sayfa</span>
          </a>
        </div>
        <div class="top-bar-right">
          <div class="social-links">
            <a href="https://www.facebook.com/people/Bejing-medya/61590594643490/" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://x.com/Bejingmed" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://www.instagram.com/medyabjng" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.youtube.com/@BejingMedya" target="_blank"><i class="fa-brands fa-youtube"></i></a>
            <a href="http://t.me/bejingmedya" target="_blank"><i class="fa-brands fa-telegram"></i></a>
          </div>
          <div class="lang-switcher">
            <button type="button" class="lang-btn active" data-lang="tr" onclick="setLanguage('tr')">Türkçe</button>
            <button type="button" class="lang-btn" data-lang="ku" onclick="setLanguage('ku')">Kurmancî</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner" style="justify-content: space-between;">
        <a href="index.html" class="brand-wrapper" title="Bêjing Medya">
          <img src="assets/images/logo.png" alt="Bêjing Medya Logo" class="brand-logo-img">
          <div class="brand-divider"></div>
          <span class="brand-slogan-text" id="headerBrandSlogan">Genç Kadınların Sesi</span>
        </a>
        <div class="header-right-actions">
          <a href="videos.html" class="telegram-pill-btn" style="background: var(--c-mahogany);">
            <i class="fa-solid fa-play"></i>
            <span data-i18n="navVideos">Videolar</span>
          </a>
          <a href="http://t.me/bejingmedya" target="_blank" class="telegram-pill-btn">
            <i class="fa-brands fa-telegram"></i>
            <span data-i18n="joinTelegram">Kanala Katıl</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="article-page-wrap">
    <div class="container">
      <article class="article-container" id="articleSingleContainer">
        
        <header class="article-header">
          <span class="category-pill" id="articleCategoryPill">Kategori</span>
          <h1 class="article-page-title" id="articleTitle">Makale Başlığı</h1>
          <div class="article-meta" style="color: var(--c-text-muted); display: flex; flex-wrap: wrap; gap: 16px;">
            <span><i class="fa-regular fa-clock"></i> <span id="articleDate">--</span></span>
            <span><i class="fa-regular fa-user"></i> <span id="articleAuthor">Bêjing Medya</span></span>
            <span><i class="fa-solid fa-book-open"></i> <span id="articleReadTime">--</span></span>
          </div>
        </header>

        <!-- Reading Controls -->
        <div class="article-reading-tools">
          <span style="font-size: 0.9rem; font-weight: 600; color: var(--c-mahogany);">
            <i class="fa-solid fa-text-height"></i> <span data-i18n="articleFontSize">Yazı Boyutu</span>
          </span>
          <div style="display: flex; gap: 6px;">
            <button type="button" class="font-adjust-btn" onclick="adjustFontSize(-1)">A-</button>
            <button type="button" class="font-adjust-btn" onclick="adjustFontSize(0)">A</button>
            <button type="button" class="font-adjust-btn" onclick="adjustFontSize(1)">A+</button>
          </div>
        </div>

        <!-- Featured Image -->
        <div class="article-featured-img-wrap" id="articleImageWrapper">
          <img id="articleImage" src="assets/images/logo.png" alt="Article image" onerror="this.style.display='none'">
        </div>

        <!-- Embedded YouTube Video Container (if article has video) -->
        <div class="article-video-container" id="articleVideoBox" style="display: none;">
          <div style="margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: var(--c-gold);">
            <i class="fa-brands fa-youtube" style="font-size: 1.4rem; color: #FF0000;"></i>
            <strong data-i18n="watchArticleVideo">Bu Yazının Videosunu İzle</strong>
          </div>
          <div class="video-responsive-wrap" id="articleVideoWrap"></div>
        </div>

        <!-- Article Body -->
        <div class="article-body" id="articleBody"></div>

        <!-- Share Bar -->
        <div class="share-bar">
          <span style="font-weight: 700; font-size: 0.95rem; color: var(--c-mahogany);" data-i18n="shareArticle">Yazıyı Paylaş:</span>
          <div class="social-links" style="gap: 10px;">
            <a href="javascript:void(0)" onclick="shareTo('x')" title="X (Twitter)" style="background: var(--c-bg-surface);"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="javascript:void(0)" onclick="shareTo('facebook')" title="Facebook" style="background: var(--c-bg-surface);"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="javascript:void(0)" onclick="shareTo('whatsapp')" title="WhatsApp" style="background: var(--c-bg-surface);"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="javascript:void(0)" onclick="shareTo('telegram')" title="Telegram" style="background: var(--c-bg-surface);"><i class="fa-brands fa-telegram"></i></a>
            <a href="javascript:void(0)" onclick="copyCurrentUrl()" title="Kopyala" style="background: var(--c-bg-surface);"><i class="fa-solid fa-link"></i></a>
          </div>
        </div>

        <div style="text-align: center; margin: 30px 0;">
          <a href="index.html" class="telegram-pill-btn" style="padding: 12px 30px; font-size: 0.95rem;">
            <i class="fa-solid fa-arrow-left"></i> <span data-i18n="navHome">Ana Sayfaya Dön</span>
          </a>
        </div>

        <!-- Related Articles -->
        <div class="related-section" id="relatedSection">
          <h3 style="font-family: var(--font-display); color: var(--c-mahogany); margin-bottom: 20px;" data-i18n="relatedArticles">İlgili İncelemeler & Yazılar</h3>
          <div class="related-grid" id="relatedArticlesGrid"></div>
        </div>

      </article>
    </div>
  </main>

  <footer class="site-footer">
    <div style="text-align: center; padding: 24px 0 12px;">
      <img src="assets/images/logo.png" alt="Bêjing Medya Logo" style="max-height: 60px;">
      <div id="footerBrandSlogan" style="font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--c-gold-bright); margin-top: 6px;">Genç Kadınların Sesi</div>
    </div>
    <div class="footer-bottom">
      <div class="container" style="text-align: center;">
        <p data-i18n="copyright">© 2026 Bêjing Medya. Tüm hakları saklıdır.</p>
      </div>
    </div>
  </footer>

  <script src="assets/js/data.js?v=20260927_1435"></script>
  <script src="assets/js/i18n.js?v=20260927_1435"></script>
  <script>
    let currentFontSize = 1.15;

    function adjustFontSize(delta) {
      if (delta === 0) currentFontSize = 1.15;
      else currentFontSize = Math.min(1.45, Math.max(0.95, currentFontSize + delta * 0.1));
      document.getElementById("articleBody").style.fontSize = currentFontSize + "rem";
    }

    function shareTo(platform) {
      const url = encodeURIComponent(window.location.href);
      const title = encodeURIComponent(document.getElementById("articleTitle").textContent);
      let target = "";
      if (platform === 'x') target = "https://twitter.com/intent/tweet?url=" + url + "&text=" + title;
      if (platform === 'facebook') target = "https://www.facebook.com/sharer/sharer.php?u=" + url;
      if (platform === 'whatsapp') target = "https://api.whatsapp.com/send?text=" + title + "%20" + url;
      if (platform === 'telegram') target = "https://t.me/share/url?url=" + url + "&text=" + title;
      if (target) window.open(target, "_blank", "width=600,height=450");
    }

    function copyCurrentUrl() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert(t("copiedLink"));
      });
    }

    function loadArticleContent() {
      const urlParams = new URLSearchParams(window.location.search);
      const articleId = parseInt(urlParams.get("id"));

      const lang = getCurrentLang();
      let article = BEJING_ARTICLES.find(a => a.id === articleId);

      if (!article) {
        const langArticles = BEJING_ARTICLES.filter(a => a.lang === lang);
        article = langArticles[0] || BEJING_ARTICLES[0];
      }

      const cat = BEJING_CATEGORIES[article.categoryId];
      const catName = cat ? cat[lang] : article.categoryName;

      document.title = article.title + " | Bêjing Medya";
      document.getElementById("articleCategoryPill").textContent = catName;
      document.getElementById("articleTitle").textContent = article.title;
      document.getElementById("articleDate").textContent = article.date;
      document.getElementById("articleAuthor").textContent = article.author;
      document.getElementById("articleReadTime").textContent = article.readTime[lang] || article.readTime.tr;

      const imgEl = document.getElementById("articleImage");
      if (article.featured_image) {
        imgEl.src = article.featured_image;
        document.getElementById("articleImageWrapper").style.display = "block";
      } else {
        document.getElementById("articleImageWrapper").style.display = "none";
      }

      const videoBox = document.getElementById("articleVideoBox");
      const videoWrap = document.getElementById("articleVideoWrap");
      if (article.youtube_videos && article.youtube_videos.length > 0) {
        const vid = article.youtube_videos[0];
        videoWrap.innerHTML = '<iframe src="' + vid.embed_url + '" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>';
        videoBox.style.display = "block";
      } else {
        videoBox.style.display = "none";
        videoWrap.innerHTML = "";
      }

      // Clean all duplicate video embeds, iframes, and raw video links from article content so each article has strictly one single video player
      let cleanContent = article.content || "";
      cleanContent = cleanContent.replace(/<figure[\s\S]*?<\/figure>/gi, function(match) {
        if (/youtube|youtu\.be|vimeo|embed|video/i.test(match)) return "";
        return match;
      });
      cleanContent = cleanContent.replace(/<iframe[\s\S]*?<\/iframe>/gi, "");
      cleanContent = cleanContent.replace(/<p[^>]*>\s*https?:\/\/(?:www\.)?(?:youtube\.com|youtu\.be)[\s\S]*?<\/p>/gi, "");
      cleanContent = cleanContent.replace(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)[\w\-]+/gi, "");

      document.getElementById("articleBody").innerHTML = cleanContent;

      const relatedGrid = document.getElementById("relatedArticlesGrid");
      relatedGrid.innerHTML = "";
      const relatedList = BEJING_ARTICLES.filter(a => a.categoryId === article.categoryId && a.id !== article.id && a.lang === article.lang).slice(0, 3);

      if (relatedList.length === 0) {
        document.getElementById("relatedSection").style.display = "none";
      } else {
        document.getElementById("relatedSection").style.display = "block";
        relatedList.forEach(rel => {
          const card = document.createElement("div");
          card.className = "article-card";
          card.innerHTML = `
            <div class="article-card-thumb-wrap" onclick="window.location.href='article.html?id=${rel.id}'" style="cursor:pointer;">
              <img src="${rel.featured_image}" alt="${rel.title}" class="article-card-thumb" onerror="this.src='assets/images/logo.png'">
            </div>
            <div class="article-card-body" style="padding: 16px;">
              <h4 style="font-family: var(--font-display); font-size: 1.05rem; margin-bottom: 8px; cursor: pointer;" onclick="window.location.href='article.html?id=${rel.id}'">${rel.title}</h4>
              <span style="font-size: 0.78rem; color: var(--c-text-light);"><i class="fa-regular fa-clock"></i> ${rel.date}</span>
            </div>
          `;
          relatedGrid.appendChild(card);
        });
      }
    }

    document.addEventListener("DOMContentLoaded", loadArticleContent);
    window.addEventListener("bejing:langChange", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const articleId = parseInt(urlParams.get("id"));
      const currentArt = BEJING_ARTICLES.find(a => a.id === articleId);
      const newLang = getCurrentLang();
      if (currentArt && currentArt.lang !== newLang) {
        const topOfLang = BEJING_ARTICLES.find(a => a.lang === newLang);
        if (topOfLang) {
          window.location.href = 'article.html?id=' + topOfLang.id;
          return;
        }
      }
      loadArticleContent();
    });
  </script>
<script>
        function updateSloganDynamic() {
          const lang = (typeof getCurrentLang === 'function') ? getCurrentLang() : "tr";
          const s = (lang === "ku") ? "Dengê Jinên Ciwan" : "Genç Kadınların Sesi";
          const h = document.getElementById("headerBrandSlogan");
          const f = document.getElementById("footerBrandSlogan");
          if (h) h.textContent = s;
          if (f) f.textContent = s;
        }
        window.addEventListener("bejing:langChange", updateSloganDynamic);
        document.addEventListener("DOMContentLoaded", updateSloganDynamic);
      </script>
      </body>
</html>
