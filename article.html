<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haber Detay | Bêjing Medya</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* Detail page specific styles */
    .article-page-header { text-align: center; margin-bottom: 30px; }
    .article-page-category { display: inline-block; background: var(--c-gold-bright); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
    .article-page-title { font-family: var(--font-display); font-size: 2.5rem; color: var(--c-text-main); margin-bottom: 15px; line-height: 1.2; }
    .article-page-meta { font-size: 0.9rem; color: var(--c-text-light); display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 25px; }
    .article-page-meta span { display: flex; align-items: center; gap: 6px; }
    
    .article-featured-img-wrap { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .article-featured-img-wrap img { width: 100%; height: auto; display: block; max-height: 600px; object-fit: cover; }
    
    .article-content-body { font-family: var(--font-body); font-size: 1.15rem; line-height: 1.8; color: var(--c-text-main); }
    .article-content-body p { margin-bottom: 1.5em; }
    .article-content-body h2, .article-content-body h3 { font-family: var(--font-display); color: var(--c-mahogany); margin-top: 1.5em; margin-bottom: 0.8em; }
    .article-content-body blockquote { border-left: 4px solid var(--c-gold-bright); padding-left: 20px; margin: 2em 0; font-style: italic; color: var(--c-text-light); font-size: 1.2rem; }
    .article-content-body img { max-width: 100%; height: auto; border-radius: 8px; margin: 1.5em 0; }
    
    /* Social Share */
    .share-bar { display: flex; align-items: center; gap: 15px; padding: 15px 0; border-top: 1px solid rgba(0,0,0,0.05); border-bottom: 1px solid rgba(0,0,0,0.05); margin: 30px 0; }
    .share-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; text-decoration: none; transition: transform 0.3s ease; }
    .share-btn:hover { transform: translateY(-3px); }
    .btn-x { background: #000; }
    .btn-fb { background: #1877F2; }
    .btn-wa { background: #25D366; }
    .btn-tg { background: #0088cc; }
    
    .font-controls { display: flex; gap: 10px; margin-left: auto; }
    .font-btn { background: none; border: 1px solid var(--c-gold-bright); color: var(--c-mahogany); width: 30px; height: 30px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .font-btn:hover { background: var(--c-gold-bright); color: #fff; }
    
    .related-section { margin-top: 60px; padding-top: 30px; border-top: 2px solid rgba(125, 102, 80, 0.1); }
    .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-container">
      <div class="logo-wrap" onclick="window.location.href='index.html'" style="cursor: pointer; display: flex; align-items: center; gap: 15px;">
        <img src="assets/images/logo.png" alt="Bêjing Medya Logo" class="site-logo" style="max-height: 50px; width: auto;">
        <div class="logo-text">
          <h1>Bêjing</h1>
          <span id="headerBrandSlogan" style="color: var(--c-gold-bright);">Genç Kadınların Sesi</span>
        </div>
      </div>
      
      <button class="mobile-menu-btn" id="mobileMenuBtn">
        <i class="fa-solid fa-bars"></i>
      </button>

      <nav class="main-nav" id="mainNav">
        <ul class="nav-list">
          <li><a href="index.html" data-i18n="navHome">Ana Sayfa</a></li>
        </ul>
      </nav>

      <div class="lang-selector">
        <button class="lang-btn active" data-lang="tr">Türkçe</button>
        <button class="lang-btn" data-lang="ku">Kurmancî</button>
      </div>
    </div>
  </header>

  <main class="page-main">
    <div class="container" style="max-width: 800px; padding: 40px 20px;">
      
      <article class="article-detail">
        <header class="article-page-header">
          <span class="article-page-category" id="articleCategoryPill">Kategori</span>
          <h1 class="article-page-title" id="articleTitle">Yükleniyor...</h1>
          
          <div class="article-page-meta">
            <span><i class="fa-regular fa-clock"></i> <span id="articleDate">--.--.----</span></span>
            <span><i class="fa-regular fa-user"></i> <span id="articleAuthor">Bêjing Medya</span></span>
            <span><i class="fa-solid fa-book-open"></i> <span id="articleReadTime">- dk</span></span>
          </div>
        </header>

        <div class="article-featured-img-wrap" id="articleImageWrapper">
          <img id="articleImage" src="assets/images/logo.png" alt="Article image" onerror="this.style.display='none'">
        </div>

        <div class="share-bar">
          <span style="font-weight: 600; color: var(--c-mahogany);" data-i18n="share">Paylaş:</span>
          <a href="#" onclick="shareTo('x')" class="share-btn btn-x"><i class="fa-brands fa-x-twitter"></i></a>
          <a href="#" onclick="shareTo('facebook')" class="share-btn btn-fb"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" onclick="shareTo('whatsapp')" class="share-btn btn-wa"><i class="fa-brands fa-whatsapp"></i></a>
          <a href="#" onclick="shareTo('telegram')" class="share-btn btn-tg"><i class="fa-brands fa-telegram"></i></a>
          <a href="#" onclick="copyCurrentUrl()" class="share-btn" style="background:#666;" title="Linki Kopyala"><i class="fa-solid fa-link"></i></a>
          
          <div class="font-controls">
            <button class="font-btn" onclick="adjustFontSize(-1)">A-</button>
            <button class="font-btn" onclick="adjustFontSize(0)">A</button>
            <button class="font-btn" onclick="adjustFontSize(1)">A+</button>
          </div>
        </div>

        <div class="article-content-body" id="articleBody">
          <!-- Content dynamically injected here -->
        </div>

        <!-- Video is placed exactly here, BELOW the body! -->
        <div id="articleVideoBox" style="display: none; margin-top: 40px; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 20px;">
          <h3 style="font-family: var(--font-display); color: var(--c-mahogany); margin-bottom: 15px;" data-i18n="video">Video / İzle</h3>
          <div id="articleVideoWrap"></div>
        </div>

        <div style="text-align: center; margin: 40px 0;">
          <a href="index.html" class="telegram-pill-btn" style="padding: 12px 30px; font-size: 0.95rem;">
            <i class="fa-solid fa-arrow-left"></i> <span data-i18n="navHome">Ana Sayfaya Dön</span>
          </a>
        </div>

        <!-- Related Articles -->
        <div class="related-section" id="relatedSection">
          <h3 style="font-family: var(--font-display); color: var(--c-mahogany); margin-bottom: 20px;" data-i18n="relatedArticles">İlgili İncelemeler & Yazılar</h3>
          <div class="related-grid" id="relatedArticlesGrid"></div>
        </div>

      </article>
    </div>
  </main>

  <footer class="site-footer">
    <div style="text-align: center; padding: 24px 0 12px;">
      <img src="assets/images/logo.png" alt="Bêjing Medya Logo" style="max-height: 60px;">
      <div id="footerBrandSlogan" style="font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--c-gold-bright); margin-top: 6px;">Genç Kadınların Sesi</div>
    </div>
    <div class="footer-bottom">
      <div class="container" style="text-align: center;">
        <p data-i18n="copyright">© 2026 Bêjing Medya. Tüm hakları saklıdır.</p>
      </div>
    </div>
  </footer>

  <script src="assets/js/data.js?v=1791126987"></script>
  <script src="assets/js/i18n.js?v=1791126987"></script>
  <script>
    let currentFontSize = 1.15;

    function adjustFontSize(delta) {
      if (delta === 0) currentFontSize = 1.15;
      else currentFontSize = Math.min(1.45, Math.max(0.95, currentFontSize + delta * 0.1));
      document.getElementById("articleBody").style.fontSize = currentFontSize + "rem";
    }

    function shareTo(platform) {
      const url = encodeURIComponent(window.location.href);
      const title = encodeURIComponent(document.getElementById("articleTitle").textContent);
      let target = "";
      if (platform === 'x') target = "https://twitter.com/intent/tweet?url=" + url + "&text=" + title;
      if (platform === 'facebook') target = "https://www.facebook.com/sharer/sharer.php?u=" + url;
      if (platform === 'whatsapp') target = "https://api.whatsapp.com/send?text=" + title + "%20" + url;
      if (platform === 'telegram') target = "https://t.me/share/url?url=" + url + "&text=" + title;
      if (target) window.open(target, "_blank", "width=600,height=450");
    }

    function copyCurrentUrl() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert(t("copiedLink"));
      });
    }

    function loadArticleContent() {
      const urlParams = new URLSearchParams(window.location.search);
      const articleId = parseInt(urlParams.get("id"));

      const lang = getCurrentLang();
      let article = BEJING_ARTICLES.find(a => a.id === articleId);

      if (!article) {
        const langArticles = BEJING_ARTICLES.filter(a => a.lang === lang);
        article = langArticles[0] || BEJING_ARTICLES[0];
      }

      const cat = BEJING_CATEGORIES[article.categoryId];
      const catName = cat ? cat[lang] : article.categoryName;

      document.title = article.title + " | Bêjing Medya";
      document.getElementById("articleCategoryPill").textContent = catName;
      document.getElementById("articleTitle").textContent = article.title;
      document.getElementById("articleDate").textContent = article.date;
      document.getElementById("articleAuthor").textContent = article.author;
      document.getElementById("articleReadTime").textContent = article.readTime[lang] || article.readTime.tr;

      const imgEl = document.getElementById("articleImage");
      if (article.featured_image) {
        imgEl.src = article.featured_image;
        document.getElementById("articleImageWrapper").style.display = "block";
      } else {
        document.getElementById("articleImageWrapper").style.display = "none";
      }

      let cleanContent = article.content || "";
      cleanContent = cleanContent.replace(/<figure[\s\S]*?<\/figure>/gi, function(match) {
        if (/youtube|youtu\.be|vimeo|embed|video/i.test(match)) return "";
        return match;
      });
      cleanContent = cleanContent.replace(/<iframe[\s\S]*?<\/iframe>/gi, "");
      cleanContent = cleanContent.replace(/<p[^>]*>\s*https?:\/\/(?:www\.)?(?:youtube\.com|youtu\.be)[\s\S]*?<\/p>/gi, "");
      cleanContent = cleanContent.replace(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)[\w\-]+/gi, "");

      document.getElementById("articleBody").innerHTML = cleanContent;

      const videoBox = document.getElementById("articleVideoBox");
      const videoWrap = document.getElementById("articleVideoWrap");
      
      if (article.youtube_videos && article.youtube_videos.length > 0) {
        let html_str = "";
        article.youtube_videos.forEach(vid => {
            html_str += '<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;margin-bottom:15px;"><iframe style="position:absolute;top:0;left:0;width:100%;height:100%;" src="' + vid.embed_url + '" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe></div>';
            let watch_url = vid.embed_url.replace('/embed/', '/watch?v=');
            html_str += '<div style="margin-bottom:30px;text-align:center;"><a href="' + watch_url + '" target="_blank" style="color:var(--c-mahogany);font-weight:bold;text-decoration:underline;">Videoyu Youtube\'da İzlemek İçin Tıklayın: ' + watch_url + '</a></div>';
        });
        videoWrap.innerHTML = html_str;
        videoBox.style.display = "block";
      } else {
        videoBox.style.display = "none";
        videoWrap.innerHTML = "";
      }

      const relatedGrid = document.getElementById("relatedArticlesGrid");
      relatedGrid.innerHTML = "";
      const relatedList = BEJING_ARTICLES.filter(a => a.categoryId === article.categoryId && a.id !== article.id && a.lang === article.lang).slice(0, 3);

      if (relatedList.length === 0) {
        document.getElementById("relatedSection").style.display = "none";
      } else {
        document.getElementById("relatedSection").style.display = "block";
        relatedList.forEach(rel => {
          const card = document.createElement("div");
          card.className = "article-card";
          card.innerHTML = `
            <div class="article-card-thumb-wrap" onclick="window.location.href='article.html?id=${rel.id}'" style="cursor:pointer;">
              <img src="${rel.featured_image}" alt="${rel.title}" class="article-card-thumb" onerror="this.src='assets/images/logo.png'">
            </div>
            <div class="article-card-body" style="padding: 16px;">
              <h4 style="font-family: var(--font-display); font-size: 1.05rem; margin-bottom: 8px; cursor: pointer;" onclick="window.location.href='article.html?id=${rel.id}'">${rel.title}</h4>
              <span style="font-size: 0.78rem; color: var(--c-text-light);"><i class="fa-regular fa-clock"></i> ${rel.date}</span>
            </div>
          `;
          relatedGrid.appendChild(card);
        });
      }
    }

    document.addEventListener("DOMContentLoaded", loadArticleContent);
    window.addEventListener("bejing:langChange", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const articleId = parseInt(urlParams.get("id"));
      const currentArt = BEJING_ARTICLES.find(a => a.id === articleId);
      const newLang = getCurrentLang();
      if (currentArt && currentArt.lang !== newLang) {
        const topOfLang = BEJING_ARTICLES.find(a => a.lang === newLang);
        if (topOfLang) {
          window.location.href = 'article.html?id=' + topOfLang.id;
          return;
        }
      }
      loadArticleContent();
    });
  </script>
<script>
        function updateSloganDynamic() {
          const lang = (typeof getCurrentLang === 'function') ? getCurrentLang() : "tr";
          const s = (lang === "ku") ? "Dengê Jinên Ciwan" : "Genç Kadınların Sesi";
          const h = document.getElementById("headerBrandSlogan");
          const f = document.getElementById("footerBrandSlogan");
          if (h) h.textContent = s;
          if (f) f.textContent = s;
        }
        window.addEventListener("bejing:langChange", updateSloganDynamic);
        document.addEventListener("DOMContentLoaded", updateSloganDynamic);
</script>
</body>
</html>
